<section class="page-hero">
    <h1>Criar Conta</h1>
    <p>Preencha os dados abaixo para cadastrar um novo acesso ao sistema.</p>
</section>

<div class="content-wrap">
    <form id="cadastro-form" class="form-agendamento" style="max-width:480px;">

        <div class="form-group">
            <label for="cadastro_nome">Nome *</label>
            <input type="text" id="cadastro_nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="cadastro_sobrenome">Sobrenome *</label>
            <input type="text" id="cadastro_sobrenome" name="sobrenome" required>
        </div>

        <div class="form-group">
            <label for="cadastro_usuario">Usuário *</label>
            <input type="text" id="cadastro_usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="cadastro_senha">Senha *</label>
            <input type="password" id="cadastro_senha" name="senha" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p id="resultado"></p>
</div>

<script src="/parque_ecologico/public/js/cadastro.js"></script>
